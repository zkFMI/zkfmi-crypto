[workspace]
members = ["."]
resolver = "2"

[package]
name = "zkfmi-cosnark-trial"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Independent research implementation; not a production proof backend"

[dependencies]
ark-ff = "=0.5.0"
ark-poly = "=0.5.0"
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["scalar_field"] }
rand = "=0.8.5"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1.8"
qomm-mpc = { path = "../../../zkpi/rust/qomm-mpc" }
