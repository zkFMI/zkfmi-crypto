[workspace]
members = ["."]
resolver = "2"

[package]
name = "zkfmi-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Versioned cryptographic boundaries for the ZKFMI post-quantum migration"

[features]
default = []
# Deterministic, publicly known keys for downstream regression tests only.
test-support = []
# Host-only TLS; the signature/proof verifier remains usable without OpenSSL.
tls = ["dep:openssl", "dep:openssl-src"]

[dependencies]
openssl = { version = "=0.10.81", features = ["vendored"], optional = true }
# Keep the vendored TLS implementation on the reviewed OpenSSL 3.5 release.
openssl-src = { version = "=300.5.5", optional = true }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
rand_core_06 = { package = "rand_core", version = "=0.6.4", features = ["getrandom"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.12"

[dev-dependencies]
hex = "0.4"
